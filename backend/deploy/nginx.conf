# Nginx como proxy inverso del backend en el VPS (standby).
# - Termina TLS (usa certbot/Let's Encrypt para los certificados).
# - Aplica rate limiting REAL por IP (slowapi es defensa en profundidad).
# - Pasa la IP del cliente en X-Forwarded-For para que slowapi la lea.
# - El backend escucha solo en 127.0.0.1:8004 (firewall cierra el puerto fuera).

# Zona de rate limit: ~10 req/s por IP, ráfaga de 20.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name api.tudominio.com;          # <-- cambia por tu dominio
    # Redirige todo a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.tudominio.com;           # <-- cambia por tu dominio

    ssl_certificate     /etc/letsencrypt/live/api.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;                 # corta payloads enormes

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
