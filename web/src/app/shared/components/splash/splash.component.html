<div
  #overlay
  class="bandera-malaga fixed inset-0 z-100 flex flex-col items-center justify-center gap-lg overflow-y-auto py-lg px-margin-mobile sm:gap-xl"
>
  <div class="flex flex-wrap items-center justify-center gap-md sm:gap-lg">
    <img
      #escudo
      src="/escudo-malaga.png"
      alt="Escudo del Málaga CF"
      class="w-48 max-w-[55vw] drop-shadow-2xl sm:w-80"
    />

    <img
      #somos
      src="/somos-de-primera.jpg"
      alt="Somos de primera"
      class="w-44 max-w-[60vw] rounded-lg drop-shadow-2xl sm:w-72"
    />
  </div>

  <button
    #boton
    type="button"
    (click)="entrar()"
    class="shrink-0 rounded-full bg-secondary px-xl py-md text-label-bold uppercase tracking-wide text-black transition-transform hover:scale-105 active:scale-95"
  >
    Entrar en la liga
  </button>
</div>
