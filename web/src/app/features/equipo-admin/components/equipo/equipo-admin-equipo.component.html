@if (exito()) {
  <div class="mb-lg px-md py-sm rounded-lg bg-tertiary/10 border border-tertiary/20 text-tertiary text-body-md font-medium flex items-center gap-sm">
    <span class="material-symbols-outlined text-[18px]">check_circle</span>
    {{ exito() }}
  </div>
}
@if (error()) {
  <div class="mb-lg px-md py-sm rounded-lg bg-primary/10 border border-primary/20 text-primary text-body-md font-medium flex items-center gap-sm">
    <span class="material-symbols-outlined text-[18px]">error</span>
    {{ error() }}
  </div>
}

<input id="escudo-input" type="file" accept="image/*" class="hidden" (change)="onEscudo($event)" [disabled]="subiendo()" />

<!-- Centrado horizontal -->
<div style="display:flex;justify-content:center;width:100%">
  <div style="width:380px;max-width:100%;border-radius:16px;background:#fff;border:1px solid rgba(192,85,42,0.12);box-shadow:0 4px 24px rgba(0,0,0,0.06);overflow:hidden">

    <!-- Cabecera -->
    <div style="background:#1A4A2E;padding:16px 24px;display:flex;align-items:center;gap:12px">
      <span class="material-symbols-outlined" style="color:#FFD600;font-size:20px">shield</span>
      <div>
        <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,214,0,0.8);margin:0">Escudo del equipo</p>
        @if (equipo()) {
          <p style="color:#fff;font-weight:700;font-size:16px;margin:2px 0 0">{{ equipo()!.nombre }}</p>
        }
      </div>
    </div>

    <!-- Cuerpo -->
    <div style="padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:24px">

      <!-- Escudo clickable -->
      <label for="escudo-input" style="cursor:pointer;display:block;position:relative" [class.pointer-events-none]="subiendo()">
        <div style="width:160px;height:160px;border-radius:16px;border:2px dashed rgba(192,85,42,0.25);background:rgba(15,25,35,0.05);display:flex;align-items:center;justify-content:center;overflow:hidden">
          @if (urlActual) {
            <img [src]="urlActual" alt="Escudo" style="width:100%;height:100%;object-fit:contain;padding:12px" />
          } @else {
            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(15,25,35,0.2)">
              <span class="material-symbols-outlined" style="font-size:52px">shield</span>
              <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em">Sin escudo</span>
            </div>
          }
        </div>
        @if (subiendo()) {
          <div style="position:absolute;inset:0;border-radius:16px;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center">
            <span class="material-symbols-outlined animate-spin" style="color:#fff;font-size:32px">progress_activity</span>
          </div>
        }
      </label>

      <div style="text-align:center">
        <p style="color:rgba(15,25,35,0.6);font-size:14px;margin:0">Haz clic en el escudo para cambiarlo</p>
        <p style="color:rgba(15,25,35,0.3);font-size:11px;margin:4px 0 0">PNG, JPG o SVG · Máx. 5 MB</p>
      </div>

      <!-- Botón -->
      <label
        for="escudo-input"
        style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 24px;border-radius:12px;background:#C0552A;color:#fff;font-weight:600;font-size:14px;cursor:pointer"
        [class.opacity-50]="subiendo()"
        [class.pointer-events-none]="subiendo()"
      >
        @if (subiendo()) {
          <span class="material-symbols-outlined animate-spin" style="font-size:18px">progress_activity</span>
          Subiendo…
        } @else {
          <span class="material-symbols-outlined" style="font-size:18px">upload</span>
          {{ urlActual ? 'Cambiar escudo' : 'Subir escudo' }}
        }
      </label>

    </div>
  </div>
</div>
