<app-navbar-light />

<div class="min-h-screen bg-background pt-16 md:ml-64">
  <!-- Cabecera -->
  <div class="bg-tertiary px-margin-desktop py-md flex items-center gap-sm">
    <span class="material-symbols-outlined text-secondary text-[20px]">shield</span>
    <div>
      <p class="text-label-bold text-secondary uppercase tracking-widest">Panel Entrenador</p>
      @if (equipo()) {
        <p class="text-[12px] text-white/60 mt-0.5">{{ equipo()!.nombre }}</p>
      }
    </div>
  </div>

  <!-- Tabs -->
  <div class="border-b border-outline bg-surface">
    <div class="px-margin-desktop flex gap-xs overflow-x-auto">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          (click)="setTab(tab.id)"
          class="flex items-center gap-1.5 px-md py-sm text-body-md whitespace-nowrap border-b-2 transition-colors"
          [class.border-primary]="tabActiva() === tab.id"
          [class.text-primary]="tabActiva() === tab.id"
          [class.font-semibold]="tabActiva() === tab.id"
          [class.border-transparent]="tabActiva() !== tab.id"
          [class.text-on-background]="tabActiva() !== tab.id"
          [class.opacity-60]="tabActiva() !== tab.id"
        >
          <span class="material-symbols-outlined text-[16px]">{{ tab.icon }}</span>
          {{ tab.label }}
        </button>
      }
    </div>
  </div>

  <!-- Contenido -->
  <div class="px-margin-desktop py-lg">
    @switch (tabActiva()) {
      @case ('plantilla') {
        <app-equipo-admin-plantilla [equipoId]="equipoId()" />
      }
      @case ('alineacion') {
        <app-equipo-admin-alineacion [equipoId]="equipoId()" />
      }
      @case ('equipo') {
        <app-equipo-admin-equipo [equipo]="equipo()" [equipoId]="equipoId()" />
      }
    }
  </div>
</div>
